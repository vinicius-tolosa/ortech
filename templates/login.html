<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ortech - Login do Colaborador</title>
    <style>
        :root {
            --bg: #0b0b0c;
            --card: #161618;
            --text: #f5f5f7;
            --muted: #88888b;
            --accent: #ffcc00;
            --border: #2a2a2c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background: var(--card); border: 1px solid var(--border); padding: 40px; border-radius: 12px; width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .logo { font-size: 24px; font-weight: 900; margin-bottom: 25px; text-align: center; }
        .logo span { color: var(--accent); }
        form { display: flex; flex-direction: column; gap: 15px; }
        label { font-size: 12px; color: var(--muted); }
        input { width: 100%; padding: 12px; background: #222226; border: 1px solid var(--border); color: #fff; border-radius: 6px; font-size: 14px; }
        input:focus { border-color: var(--accent); outline: none; }
        button { background-color: var(--accent); color: #000; border: none; padding: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        button:hover { opacity: 0.9; }
        .error { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; text-align: center; }
        .back-home { display: block; text-align: center; margin-top: 20px; color: var(--muted); font-size: 13px; text-decoration: none; }
        .back-home:hover { color: var(--accent); }
    </style>

     <!-- Script colocado no HEAD para aplicar o tema salvo instantaneamente ao carregar -->
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>
<body>
    <div class="login-card">
        <div class="logo">ORTECH<span>.</span></div>
        <h2 style="font-size: 16px; margin-bottom: 20px; text-align: center; color: var(--muted);">Acesso Restrito ao Colaborador</h2>
        
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form action="/login" method="POST">
            <div>
                <label>Nome de Usuário</label>
                <input type="text" name="username" required autocomplete="off">
            </div>
            <div>
                <label>Senha</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit">Entrar no Painel</button>
        </form>
        <a href="/" class="back-home">&larr; Voltar para a Loja Principal</a>
    </div>
</body>
</html>
